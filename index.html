// Atenção: como este arquivo roda inteiramente no navegador, essa senha fica visível

function firebaseUrl(chave) {
  return `${FIREBASE_DB_URL}/shared/${encodeURIComponent(chave)}.json`;
}

window.storage = {
  get: async (chave, compartilhado) => {
    if (compartilhado && FIREBASE_CONFIGURADO) {
      const resp = await fetch(firebaseUrl(chave));
      if (!resp.ok) throw new Error("erro ao buscar " + chave);
      const valor = await resp.json();
      if (valor == null) throw new Error("chave não encontrada: " + chave);
      return {key: chave, value: valor, shared: true};
    }
    const prefixo = (compartilhado ? "shared:" : "personal:") + chave;
    const valor = window.localStorage.getItem(prefixo);
    if (valor === null) throw new Error("chave não encontrada: " + chave);
    return {key: chave, value: valor, shared: !!compartilhado};
  },
  set: async (chave, valor, compartilhado) => {
    if (compartilhado && FIREBASE_CONFIGURADO) {
      const resp = await fetch(firebaseUrl(chave), {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(valor)
      });
      if (!resp.ok) throw new Error("erro ao salvar " + chave);
      return {key: chave, value: valor, shared: true};
    }
    const prefixo = (compartilhado ? "shared:" : "personal:") + chave;
    window.localStorage.setItem(prefixo, valor);
    return {key: chave, value: valor, shared: !!compartilhado};
  },
  delete: async (chave, compartilhado) => {
    if (compartilhado && FIREBASE_CONFIGURADO) {
      await fetch(firebaseUrl(chave), {method: "DELETE"});
      return {key: chave, deleted: true, shared: true};
    }
    const prefixo = (compartilhado ? "shared:" : "personal:") + chave;
    window.localStorage.removeItem(prefixo);
    return {key: chave, deleted: true, shared: !!compartilhado};
  },
  list: async (prefixoBusca, compartilhado) => {
    const prefixo = compartilhado ? "shared:" : "personal:";
    const alvo = prefixo + (prefixoBusca || "");
    const chaves = [];
    for (let i = 0; i < window.localStorage.length; i++) {
      const chave = window.localStorage.key(i);
      if (chave && chave.indexOf(alvo) === 0) chaves.push(chave.slice(prefixo.length));
    }
    return {keys: chaves, prefix: prefixoBusca, shared: !!compartilhado};
  }
};

        /* Vinheta permanente de sangue nas bordas: aparece IMEDIATAMENTE (sem delay, sem
           animação de entrada) sempre que a vida estiver no quadrado 5 ou abaixo — direto
           a partir do estado atual, não de uma detecção de "queda". Já nasce no máximo. */
        .vinheta-critica {
          position: fixed; inset: 0; z-index: 9998; pointer-events: none;
          background:
            radial-gradient(ellipse 60% 55% at 50% 50%, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 40%, rgba(60,0,0,0.55) 78%, rgba(20,0,0,0.88) 100%),
            radial-gradient(circle 90px at 6% 4%, rgba(139,0,0,0.9) 0%, rgba(139,0,0,0.5) 45%, transparent 75%),
            radial-gradient(circle 70px at 92% 8%, rgba(139,0,0,0.85) 0%, rgba(139,0,0,0.45) 45%, transparent 75%),
            radial-gradient(circle 60px at 96% 55%, rgba(139,0,0,0.85) 0%, rgba(139,0,0,0.4) 45%, transparent 75%),
            radial-gradient(circle 80px at 4% 70%, rgba(139,0,0,0.85) 0%, rgba(139,0,0,0.4) 45%, transparent 75%),
            radial-gradient(circle 50px at 50% 3%, rgba(139,0,0,0.7) 0%, transparent 70%),
            radial-gradient(circle 55px at 50% 97%, rgba(139,0,0,0.7) 0%, transparent 70%);
          animation: vinhetaRespira 2.6s ease-in-out infinite;
        }
        .vinheta-critica::before, .vinheta-critica::after {
          content: ""; position: absolute; inset: 0;
          background-repeat: no-repeat;
        }
        .vinheta-critica::before {
          /* respingos pequenos espalhados perto das bordas */
          background-image:
            radial-gradient(circle 5px at 3% 20%, #8b0000 0%, transparent 100%),
            radial-gradient(circle 4px at 8% 35%, #a30d0d 0%, transparent 100%),
            radial-gradient(circle 6px at 2% 55%, #8b0000 0%, transparent 100%),
            radial-gradient(circle 4px at 12% 12%, #a30d0d 0%, transparent 100%),
            radial-gradient(circle 5px at 97% 25%, #8b0000 0%, transparent 100%),
            radial-gradient(circle 4px at 90% 40%, #a30d0d 0%, transparent 100%),
            radial-gradient(circle 6px at 98% 68%, #8b0000 0%, transparent 100%),
            radial-gradient(circle 4px at 88% 85%, #a30d0d 0%, transparent 100%),
            radial-gradient(circle 5px at 25% 5%, #8b0000 0%, transparent 100%),
            radial-gradient(circle 4px at 60% 4%, #a30d0d 0%, transparent 100%),
            radial-gradient(circle 5px at 30% 95%, #8b0000 0%, transparent 100%),
            radial-gradient(circle 4px at 70% 96%, #a30d0d 0%, transparent 100%);
        }
        .vinheta-critica::after {
          /* linhas de escorrido finas na base, como na referência */
          background-image:
            linear-gradient(180deg, #8b0000 0%, transparent 100%),
            linear-gradient(180deg, #6b0000 0%, transparent 100%),
            linear-gradient(180deg, #8b0000 0%, transparent 100%);
          background-size: 2px 90px, 2px 55px, 2px 70px;
          background-position: 8% 100%, 14% 100%, 20% 100%;
        }
        @keyframes vinhetaRespira {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.9; }
        }

        .efeito-dano-camada { position: fixed; inset: 0; z-index: 9999; pointer-events: none; overflow: hidden; }
        .efeito-dano-flash {
          position: absolute; inset: 0;
          background: radial-gradient(ellipse at 50% 45%, rgba(139,0,0,0.15) 0%, rgba(90,0,0,0.55) 65%, rgba(50,0,0,0.72) 100%);
          animation: efeitoDanoFlash 5s ease-out forwards;
        }
        @keyframes efeitoDanoFlash {
          0%   { opacity: 0; }
          6%   { opacity: 1; }
          20%  { opacity: 0.72; }
          80%  { opacity: 0.6; }
          100% { opacity: 0; }
        }
        .impacto-sangue { position: absolute; width: 0; height: 0; }
        .splat-principal {
          position: absolute; top: 0; left: 0; transform: translate(-50%, -50%) scale(0) rotate(var(--girosplat, 0deg));
          background: radial-gradient(circle at 35% 30%, #c53a30 0%, #8b0000 42%, #5c0808 78%, #3a0404 100%);
          filter: drop-shadow(0 3px 5px rgba(0,0,0,0.55));
          animation: splatAparece 5s cubic-bezier(.16,.9,.25,1) forwards;
        }
        @keyframes splatAparece {
          0%   { opacity: 0; transform: translate(-50%, -50%) scale(0) rotate(var(--girosplat, 0deg)); }
          6%   { opacity: 1; transform: translate(-50%, -50%) scale(1.18) rotate(var(--girosplat, 0deg)); }
          14%  { transform: translate(-50%, -50%) scale(1) rotate(var(--girosplat, 0deg)); }
          85%  { opacity: 1; }
          100% { opacity: 0; }
        }
        .respingo {
          position: absolute; top: 0; left: 0; border-radius: 50%;
          background: radial-gradient(circle at 35% 30%, #c53a30 0%, #8b0000 55%, #4a0505 100%);
          box-shadow: inset -2px -2px 3px rgba(0,0,0,0.5);
          transform: translate(0, 0) scale(0) rotate(var(--rot, 0deg));
          animation: respingoVoa 5s cubic-bezier(.1,.85,.25,1) forwards;
        }
        @keyframes respingoVoa {
          0%   { opacity: 0; transform: translate(0, 0) scale(0) rotate(var(--rot, 0deg)); }
          5%   { opacity: 1; }
          18%  { transform: translate(var(--dx, 40px), var(--dy, 40px)) scale(1) rotate(var(--rot, 0deg)); }
          85%  { opacity: 0.95; transform: translate(var(--dx, 40px), var(--dy, 40px)) scale(1) rotate(var(--rot, 0deg)); }
          100% { opacity: 0; transform: translate(var(--dx, 40px), var(--dy, 40px)) scale(0.9) rotate(var(--rot, 0deg)); }
        }

// Vigor (teto de fadiga) é derivado, não digitado à mão: todo personagem começa com 100 de
// base; cada nível geral acima do 1 soma +100, e cada nível do atributo Força acima do 1
// soma +50. Em nível 1 com Força 1 (o estado inicial), dá exatamente os 100 de base.
const FADIGA_BASE = 100;
const FADIGA_BONUS_POR_NIVEL = 100;
const FADIGA_BONUS_POR_FORCA = 50;
function calcularFadigaMax(personagem, atributos) {
  const nivel = parseInt(personagem && personagem.nivel, 10) || 1;
  const forcaAttr = (atributos || []).find(a => normalizarNome(a.nome) === "forca");
  const forca = forcaAttr ? (parseInt(forcaAttr.valor, 10) || 1) : 1;
  return FADIGA_BASE + (nivel - 1) * FADIGA_BONUS_POR_NIVEL + (forca - 1) * FADIGA_BONUS_POR_FORCA;
}

function deepMerge(base, salvo) {
  if (!salvo || typeof salvo !== "object") return base;
  const t = {...base, ...salvo};
  t.personagem = {...base.personagem, ...(salvo.personagem || {})};
  t.vida = {...base.vida, ...(salvo.vida || {})};
  t.armadura = {...base.armadura, ...(salvo.armadura || {})};
  t.falhas = {...base.falhas, ...(salvo.falhas || {})};
  t.falhasSecundarias = {...base.falhasSecundarias, ...(salvo.falhasSecundarias || {})};
  t.atributos = (t.atributos && t.atributos.length ? t.atributos : base.atributos);

  // Migração única: a primeira vez que uma ficha antiga (sem essa flag) é aberta depois
  // dessa atualização, todo nível — do personagem e de cada atributo — volta pra 1. Depois
  // disso a flag fica salva e o reset nunca mais se repete; o nível sobe normalmente dali.
  t.migracoes = {...(base.migracoes || {}), ...(salvo.migracoes || {})};
  if (!t.migracoes.nivelBaseV1) {
    t.personagem = {...t.personagem, nivel: 1, subnivel: 0};
    t.atributos = t.atributos.map(a => ({...a, valor: 1, subnivel: 0}));
    t.migracoes.nivelBaseV1 = true;
  }

  // O teto de fadiga não é mais um número livre: é recalculado a partir do nível do
  // personagem e do nível de Força toda vez que a ficha é carregada/sincronizada. O que foi
  // "gasto" (teto salvo menos vigor atual salvo) é preservado sobre o novo teto, então subir
  // de nível já dá vigor extra de verdade, não só um teto maior no papel.
  const antigoMax = (salvo.fadiga && typeof salvo.fadiga.max === "number") ? salvo.fadiga.max : base.fadiga.max;
  const atualSalvo = (salvo.fadiga && typeof salvo.fadiga.atual === "number") ? salvo.fadiga.atual : base.fadiga.atual;
  const novoMax = calcularFadigaMax(t.personagem, t.atributos);
  const gasto = Math.max(0, antigoMax - atualSalvo);
  t.fadiga = {atual: Math.max(0, Math.min(novoMax, novoMax - gasto)), max: novoMax};
  return t;
}

// Redimensiona e comprime uma imagem antes de salvar (evita fichas gigantes na nuvem/localStorage)
function resizeImageFile(file, maxSize, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("erro ao ler imagem"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("erro ao processar imagem"));
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > h && w > maxSize) { h = Math.round(h * maxSize / w); w = maxSize; }
        else if (h >= w && h > maxSize) { w = Math.round(w * maxSize / h); h = maxSize; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function useAutoResize(value) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current) {
      ref.current.style.height = "auto";
      ref.current.style.height = ref.current.scrollHeight + "px";
    }
  }, [value]);
  return ref;
}

function EditableField({value, onChange, placeholder, className, multiline, ...rest}) {
  const ref = useAutoResize(value);
  if (multiline) {
    return React.createElement("textarea", {
      ref, className: "field field-multiline " + (className || ""), value, placeholder,
      onChange: e => onChange(e.target.value), rows: 1, ...rest
    });
  }
  return React.createElement("input", {
    className: "field " + (className || ""), value, placeholder,
    onChange: e => onChange(e.target.value), ...rest
  });
}

function PipTrack({atual, max, onToggle, colorFilled, colorEmpty, readOnly}) {
  const pips = [];
  for (let i = 0; i < max; i++) {
    const preenchido = i < atual;
    if (readOnly) {
      pips.push(React.createElement("span", {
        key: i,
        className: "pip pip-readonly",
        style: {background: preenchido ? colorFilled : "transparent", borderColor: preenchido ? colorFilled : colorEmpty},
        "aria-label": preenchido ? "marcado" : "vazio"
      }));
    } else {
      pips.push(React.createElement("button", {
        key: i,
        onClick: () => onToggle(i + 1 === atual ? i : i + 1),
        className: "pip",
        style: {background: preenchido ? colorFilled : "transparent", borderColor: preenchido ? colorFilled : colorEmpty},
        "aria-label": preenchido ? "marcado" : "vazio"
      }));
    }
  }
  return React.createElement("div", {className: "pip-row"}, pips);
}

// --- Roda de atributos: traços retos no lugar dos quadrados de subnível ---
function pontoRaw(cx, cy, r, anguloGraus) {
  const a = anguloGraus * Math.PI / 180;
  return {x: cx + r * Math.cos(a), y: cy + r * Math.sin(a)};
}
// 10 traços curtos no lado externo do círculo (metade voltada pra fora da roda),
// deixando livre o lado interno onde passa o trilho duplo até o círculo central e os vizinhos.
// Clareia uma cor hex misturando com branco (pct de 0 a 1) — usada pra deixar os
// traços preenchidos do subnível mais vivos/brilhantes que a cor base do atributo.
function clarearCor(hex, pct) {
  const h = (hex || "").replace("#", "");
  if (h.length !== 6) return hex;
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  const mix = c => Math.round(c + (255 - c) * pct);
  return `rgb(${mix(r)}, ${mix(g)}, ${mix(b)})`;
}
// O dado que aquele atributo rola em testes, de acordo com o valor (nível) atual dele.
// Tabela de dados por nível (mesma regra pra atributos e perícias): quanto maior o nível,
// melhor o dado ou a chance de bater o alvo. A partir do nível 8 o sistema estabiliza —
// não tem regra definida além disso, então repete o do nível 8 pra qualquer nível maior.
const TABELA_DADOS_NIVEL = [
  {nivel: 1, notacao: "d4", melhorDe: 1, alvo: 4},
  {nivel: 2, notacao: "2d4", melhorDe: 2, alvo: 4},
  {nivel: 3, notacao: "d6", melhorDe: 1, alvo: 4},
  {nivel: 4, notacao: "d8", melhorDe: 1, alvo: 4},
  {nivel: 5, notacao: "d10", melhorDe: 1, alvo: 4},
  {nivel: 6, notacao: "d12", melhorDe: 1, alvo: 4},
  {nivel: 7, notacao: "d20", melhorDe: 1, alvo: 4},
  {nivel: 8, notacao: "d20", melhorDe: 1, alvo: 2}
];
function dadoPorNivel(nivel) {
  const n = Math.max(1, parseInt(nivel, 10) || 1);
  return TABELA_DADOS_NIVEL[Math.min(n, 8) - 1];
}
// Texto compacto ("d4 ≥4") pra espaços pequenos, e um texto completo com "(melhor)" pros
// níveis que rolam mais de um dado e ficam com o resultado mais alto.
function textoDadoCompacto(info) {
  return `${info.notacao} \u2265${info.alvo}`;
}
function textoDadoCompleto(info) {
  return `${info.notacao}${info.melhorDe > 1 ? " (melhor)" : ""} \u2265${info.alvo}`;
}
function dadoPorNivelAtributo(valor) {
  return dadoPorNivel(valor).notacao;
}
// Aplica um novo total de progresso (subnível) a um nível atual, seguindo a mesma regra em
// todo o sistema — atributos, perícias e agora o nível do personagem: pra subir de N pra N+1
// precisa de N*100 pontos de progresso; se o valor digitado ultrapassar o teto atual, sobe
// quantos níveis forem necessários, carregando o excedente.
function aplicarProgressoNivel(nivelAtual, novoTotal) {
  let nivel = parseInt(nivelAtual, 10) || 1;
  let sub = Math.max(0, novoTotal || 0);
  let teto = nivel * 100;
  while (sub >= teto) {
    sub -= teto;
    nivel += 1;
    teto = nivel * 100;
  }
  return {nivel, sub};
}
function aplicarSubnivel(attr, novoValor) {
  const {nivel, sub} = aplicarProgressoNivel(attr.valor, novoValor);
  return {...attr, valor: nivel, subnivel: sub};
}
// Mesma progressão, só que pro nível geral do personagem (data.personagem.nivel/subnivel)
// em vez de um atributo — usada pela caixa de nível com a barra visual.
function aplicarSubnivelPersonagem(personagem, novoValor) {
  const {nivel, sub} = aplicarProgressoNivel(personagem.nivel, novoValor);
  return {...personagem, nivel, subnivel: sub};
}
// Usar uma perícia ou testar um atributo concede XP pro nível geral do personagem — sempre
// 1,5 ponto de progresso por uso, somado na mesma barra de "Nível" do topo da ficha.
const XP_POR_USO = 1.5;
const XP_POR_USO_LABEL = "1,5";
function ganharXpNivel(setPath, data) {
  const personagem = (data && data.personagem) || {nivel: 1, subnivel: 0};
  const atual = personagem.subnivel || 0;
  setPath(["personagem"], aplicarSubnivelPersonagem(personagem, atual + XP_POR_USO));
  // O teto de vigor (que depende do nível) é recalculado pela sincronização periódica da
  // ficha, não aqui — assim não conflita com o desconto de vigor que o chamador já fez
  // na mesma ação.
}
function TracosSubnivel({atual, max, colorFilled, colorEmpty, angulo}) {
  const size = 100, cx = 50, cy = 50, r = 44.5;
  const meioArco = 80;
  const corBrilho = clarearCor(colorFilled, 0.35);
  const pct = max > 0 ? Math.max(0, Math.min(1, atual / max)) : 0;
  const anguloInicio = angulo - meioArco;
  const anguloFim = angulo + meioArco;
  const anguloPreenchido = anguloInicio + (anguloFim - anguloInicio) * pct;
  const arco = (de, ate, cor, largura, comBrilho) => {
    if (ate - de < 0.5) return null;
    const p1 = pontoRaw(cx, cy, r, de);
    const p2 = pontoRaw(cx, cy, r, ate);
    const largeArc = (ate - de) > 180 ? 1 : 0;
    return React.createElement("path", {
      d: `M${p1.x.toFixed(2)},${p1.y.toFixed(2)} A${r},${r} 0 ${largeArc} 1 ${p2.x.toFixed(2)},${p2.y.toFixed(2)}`,
      fill: "none", stroke: cor, strokeWidth: largura, strokeLinecap: "round",
      style: comBrilho ? {filter: `drop-shadow(0 0 3px ${colorFilled})`} : undefined
    });
  };
  return React.createElement("svg", {viewBox: `0 0 ${size} ${size}`, className: "atributo-ring"},
    // trilho vazio (fundo do anel), depois o trecho preenchido por cima, brilhando
    arco(anguloInicio, anguloFim, colorEmpty, 2.6, false),
    arco(anguloInicio, anguloPreenchido, corBrilho, 3.4, true)
  );
}
function AtributoSatelite({attr, souMestre, angulo, raioPct, onSubnivelToggle, onRemover, onTestar}) {
  const cor = corAtributo(attr.nome);
  const subnivel = attr.subnivel || 0;
  const maxSubnivel = (parseInt(attr.valor, 10) || 1) * 100;
  const [editando, setEditando] = useState(false);
  const [valorDigitado, setValorDigitado] = useState("");
  const style = {
    top: `${50 + raioPct * Math.sin(angulo * Math.PI / 180)}%`,
    left: `${50 + raioPct * Math.cos(angulo * Math.PI / 180)}%`,
    color: cor,
    cursor: (souMestre || onTestar) ? "pointer" : "default"
  };
  const abrirEdicao = e => {
    e.stopPropagation();
    setValorDigitado(String(subnivel));
    setEditando(true);
  };
  const confirmar = () => {
    const n = parseInt(valorDigitado, 10);
    if (!isNaN(n)) onSubnivelToggle(Math.max(0, n));
    setEditando(false);
  };
  // Mestre toca pra editar o subnível direto; jogador toca pro mesmo círculo pra testar
  // o atributo (rola o dado, gasta vigor, ganha XP de nível) — é o mesmo gesto de toque,
  // só que com efeitos diferentes por papel.
  const aoClicar = souMestre
    ? (!editando ? abrirEdicao : undefined)
    : (onTestar ? () => onTestar(attr) : undefined);
  return React.createElement("div", {
    className: "atributo-satelite",
    style,
    onClick: aoClicar,
    "aria-label": souMestre
      ? "toque pra editar o subnível de " + (attr.nome || "atributo")
      : (onTestar ? "toque pra testar " + (attr.nome || "atributo") : undefined)
  },
    React.createElement(TracosSubnivel, {
      atual: subnivel, max: maxSubnivel, colorFilled: cor, colorEmpty: "#5f5644", angulo
    }),
    editando
      ? React.createElement("div", {className: "atributo-satelite-inner atributo-satelite-editando", onClick: e => e.stopPropagation()},
          React.createElement("input", {
            type: "number", className: "subnivel-edit-input", autoFocus: true,
            value: valorDigitado, min: 0,
            onChange: e => setValorDigitado(e.target.value),
            onBlur: confirmar,
            onKeyDown: e => { if (e.key === "Enter") e.target.blur(); if (e.key === "Escape") setEditando(false); }
          }),
          React.createElement("span", {className: "subnivel-edit-max"}, "/ ", maxSubnivel)
        )
      : React.createElement("div", {className: "atributo-satelite-inner"},
          React.createElement("span", {className: "atributo-satelite-valor"}, attr.valor),
          React.createElement("span", {className: "atributo-satelite-nome-completo", style: {color: clarearCor(cor, 0.45)}}, subnivel, "/", maxSubnivel),
          React.createElement("span", {className: "atributo-satelite-abrev"}, abreviarAtributo(attr.nome))
        ),
    souMestre && onRemover && React.createElement("button", {
      className: "atributo-satelite-remove",
      onClick: (e) => { e.stopPropagation(); onRemover(); },
      "aria-label": "remover atributo"
    }, "\u00D7")

  const dx = x2 - x1, dy = y2 - y1;

  ];
  const nTravessas = Math.max(2, Math.round(comprimento / 6));
  for (let i = 1; i < nTravessas; i++) {
    const t = i / nTravessas;

  const ordenados = [...atributos].sort((a, b) => (parseInt(b.valor, 10) || 0) - (parseInt(a.valor, 10) || 0));

  const trilhos = n >= 2
    ? pontos.map((p, i) => {

    ganharXpNivel(setPath, {personagem, atributos, fadiga});
    setAviso(`${attr.nome} testado (-${CUSTO_FADIGA_ATRIBUTO} vigor, +${XP_POR_USO_LABEL} XP de nível).`);

    React.createElement("div", {className: "atributos-roda"},

function buildHighlighter(classificacao) {
  const validos = (classificacao || []).filter(c => c.nome && c.nome.trim())
    .sort((a, b) => b.nome.trim().length - a.nome.trim().length);
  if (!validos.length) return null;
  const termos = validos.map(c => c.nome.trim().replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  let regex;
  try {
    regex = new RegExp(`(?<![\\w\\xC0-\\xFF])(${termos.join("|")})(?![\\w\\xC0-\\xFF])`, "gi");
  } catch (e) {
    return null;
  }
  return {
    regex,
    colorFor: nome => {
      const achado = validos.find(c => c.nome.trim().toLowerCase() === nome.toLowerCase());
      return achado ? achado.cor : null;
    }
  };
}

function ColoredText({text, highlighter}) {

  const {regex, colorFor} = highlighter;
  regex.lastIndex = 0;
  const partes = [];
  let ultimo = 0, m;
  while ((m = regex.exec(text)) !== null) {
    if (m.index > ultimo) partes.push(text.slice(ultimo, m.index));
    const cor = colorFor(m[0]);
    partes.push(React.createElement("span", {key: m.index + "-" + m[0], style: {color: cor || "inherit", fontWeight: 700}}, m[0]));
    ultimo = m.index + m[0].length;

  if (ultimo < text.length) partes.push(text.slice(ultimo));

}

// Fotos de lugares que o mestre cadastra e compartilha com os jogadores.
// Índice compartilhado leve (com miniatura) + imagem em tamanho completo guardada à parte,
// carregada só quando alguém amplia a foto.
// Mesmo mecanismo de permissão das Perícias: por padrão NINGUÉM vê a foto (permitidos
// vazio = "visível para ninguém"); o mestre libera quem pode ver, foto por foto, ou de
// uma vez com "liberar pra todos".
// Galeria organizada em categorias nomeadas pelo mestre (ex.: Humanos, Monstros,
// Aberrações), cada categoria com sua própria lista de fotos — mesmo padrão das Lojas.
async function carregarGaleriaIndex() {
  try {
    const r = await window.storage.get("galeria-index", true);
    if (!r || !r.value) return [];
    const dados = JSON.parse(r.value);
    if (!Array.isArray(dados) || dados.length === 0) return [];
    // Migração do formato antigo (lista plana de fotos, sem categorias): agrupa tudo
    // numa única categoria "Sem categoria" pra não perder nada que já estava salvo.
    if (dados[0] && dados[0].fotos === undefined && dados[0].thumb !== undefined) {
      return [{id: uid(), nome: "Sem categoria", fotos: dados}];
    }
    return dados;
  } catch (e) {
    return [];
  }
}
async function salvarGaleriaIndex(categorias) {
  await window.storage.set("galeria-index", JSON.stringify(categorias), true);
}

    React.createElement("div", {className: "list-row", style: {marginBottom: 14}},
      React.createElement(EditableField, {value: categoria.nome, onChange: onRenomear, className: "list-input", placeholder: "nome da categoria"}),
      React.createElement("button", {className: "row-remove", onClick: onRemoverCategoria, "aria-label": "remover categoria"}, React.createElement(X, {size: 14}))
    ),
    React.createElement("div", {style: {display: "flex", gap: 12, alignItems: "flex-start", marginBottom: 10}},
      React.createElement("div", {className: "personagem-foto-wrap"},
        novaImagem
          ? React.createElement("img", {src: novaImagem.thumb, className: "personagem-foto", onClick: escolherArquivo, alt: "prévia"})
          : React.createElement("button", {type: "button", className: "personagem-foto-placeholder", onClick: escolherArquivo}, "+ foto"),
        React.createElement("input", {ref: inputArquivoRef, type: "file", accept: "image/*", style: {display: "none"}, onChange: aoSelecionarArquivo})
      ),
      React.createElement("div", {style: {flex: 1, minWidth: 0}},
        React.createElement("span", {className: "stat-label"}, "Título da foto"),
        React.createElement("input", {className: "field", value: novoTitulo, onChange: e => setNovoTitulo(e.target.value), placeholder: "nome"})
      )
    ),
    erro && React.createElement("p", {style: {color: "#d9573a", fontSize: 12, margin: "0 0 10px"}}, erro),
    React.createElement("button", {className: "add-row", onClick: adicionar, disabled: enviando, style: {marginBottom: 14}}, React.createElement(Plus, {size: 13}), enviando ? " salvando…" : " adicionar foto"),
    fotos.length === 0
      ? React.createElement("p", {className: "mestre-empty"}, "Nenhuma foto nesta categoria ainda.")
      : React.createElement(GaleriaGrid, {

            React.createElement("div", {className: "galeria-card-actions"},

// Visão do mestre: cria categorias nomeadas (Humanos, Monstros, Aberrações…) e, dentro de
// cada uma, adiciona fotos com título e controla quais personagens têm acesso a cada uma
// (por padrão ninguém, igual às Perícias).
function GaleriaMestre() {
  const [categorias, setCategorias] = useState([]);
  const [personagens, setPersonagens] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [novaCategoriaNome, setNovaCategoriaNome] = useState("");

  const carregar = useCallback(async () => {
    setCarregando(true);
    setCategorias(await carregarGaleriaIndex());
    try {
      const r = await window.storage.get("ficha-index", true);
      setPersonagens(r && r.value ? JSON.parse(r.value) : []);
    } catch (e) {
      setPersonagens([]);
    }
    setCarregando(false);
  }, []);

  useEffect(() => { carregar(); }, [carregar]);

  const persistir = async nova => {
    setCategorias(nova);
    try { await salvarGaleriaIndex(nova); } catch (e) {}
  };

  const adicionarCategoria = () => {
    const nome = novaCategoriaNome.trim() || "Nova categoria";
    persistir([...categorias, {id: uid(), nome, fotos: []}]);
    setNovaCategoriaNome("");
  };
  const renomearCategoria = (catId, nome) => persistir(categorias.map(c => c.id === catId ? {...c, nome} : c));
  const removerCategoria = catId => {
    if (!window.confirm("Remover esta categoria e todas as fotos dentro dela? Isso não pode ser desfeito.")) return;
    persistir(categorias.filter(c => c.id !== catId));
  };
  const setFotosDaCategoria = (catId, novasFotos) => persistir(categorias.map(c => c.id === catId ? {...c, fotos: novasFotos} : c));
  // Move uma foto da categoria em que ela está pra outra categoria já existente — sai de
  // uma lista, entra na outra com permissão zerada (igual foto recém-adicionada).
  const moverFotoParaCategoria = (foto, origemCatId, destinoCatId) => {
    if (origemCatId === destinoCatId) return;
    persistir(categorias.map(c => {
      if (c.id === origemCatId) return {...c, fotos: (c.fotos || []).filter(f => f.id !== foto.id)};
      if (c.id === destinoCatId) return {...c, fotos: [...(c.fotos || []), {...foto, permitidos: []}]};
      return c;
    }));
  };

  return React.createElement(React.Fragment, null,
    React.createElement(SectionCard, {icon: Images, title: "Nova categoria", subtitle: "ex: Humanos, Monstros, Aberrações…", accent: "#3d6a94"},
      React.createElement("div", {style: {display: "flex", gap: 8}},
        React.createElement("input", {className: "field", value: novaCategoriaNome, onChange: e => setNovaCategoriaNome(e.target.value), placeholder: "nome da categoria", style: {flex: 1}}),
        React.createElement("button", {className: "add-row", onClick: adicionarCategoria}, React.createElement(Plus, {size: 13}), " criar")
      )
    ),
    carregando && React.createElement("p", {className: "mestre-empty"}, "Carregando…"),
    !carregando && categorias.length === 0 && React.createElement("p", {className: "mestre-empty"}, "Nenhuma categoria criada ainda."),
    !carregando && categorias.map(cat => React.createElement(GaleriaCategoriaMestre, {
      key: cat.id, categoria: cat, categorias, personagens,
      onSetFotos: novas => setFotosDaCategoria(cat.id, novas),
      onRenomear: nome => renomearCategoria(cat.id, nome),
      onRemoverCategoria: () => removerCategoria(cat.id),
      onMoverFoto: (foto, destinoCatId) => moverFotoParaCategoria(foto, cat.id, destinoCatId)
    }))
  );
}

// Card de item somente leitura, usado na visão do jogador
function ItemLojaCard({item, onAbrir, onComprar, ouroDisponivel}) {
  const [comprado, setComprado] = useState(false);
  const valor = extrairValorNumerico(item.preco);
  const semSaldo = onComprar && valor > 0 && ouroDisponivel != null && ouroDisponivel < valor;
  const clicarComprar = e => {
    e.stopPropagation();
    if (semSaldo) return;
    onComprar(item);
    setComprado(true);
    setTimeout(() => setComprado(false), 1800);
  };
  return React.createElement("div", {className: "loja-item-block"},
    React.createElement("button", {type: "button", className: "loja-item-thumb-btn", onClick: onAbrir},
      item.imagem
        ? React.createElement("img", {src: item.imagem, className: "juramento-avatar", alt: item.nome || "item"})
        : React.createElement("div", {className: "juramento-avatar-placeholder"}, "sem foto")
    ),
    React.createElement("div", {className: "loja-item-info"},
      React.createElement("div", {className: "loja-item-nome-preco"},
        React.createElement("span", {className: "loja-item-nome"}, item.nome || "Item sem nome"),
        React.createElement("span", {className: "loja-item-preco"}, item.preco || "\u2014")
      ),
      item.descricao && React.createElement("p", {className: "loja-item-descricao"}, item.descricao),
      onComprar && React.createElement("button", {
        type: "button",

// Visão do jogador: só mostra lojas liberadas para este charId, agrupadas por categoria
function LojaJogador({charId, data, setPath}) {
  const [categorias, setCategorias] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [itemAberto, setItemAberto] = useState(null);

  const carregar = useCallback(async (mostrarLoading) => {
    if (mostrarLoading) setCarregando(true);
    setCategorias(await carregarLojasIndex());
    setCarregando(false);
  }, []);

  useEffect(() => {
    carregar(true);
    const intervalId = setInterval(() => carregar(false), 8000);
    return () => clearInterval(intervalId);
  }, [carregar]);

  const visiveis = categorias
    .map(cat => ({...cat, lojas: (cat.lojas || []).filter(l => !l.permitidos || l.permitidos.length === 0 || (charId && l.permitidos.includes(charId)))}))
    .filter(cat => cat.lojas.length > 0);

  // Compra o item: manda direto pra mochila do jogador já com nome, foto e descrição, e
  // desconta o valor do ouro automaticamente (se o preço tiver algum número reconhecível).
  const comprarItem = item => {
    if (!data || !setPath) return;
    const novoItemMochila = {
      id: uid(),
      texto: item.nome || "Item comprado",
      nome: item.nome || "",
      imagem: item.imagem || null,
      descricao: item.descricao || ""
    };
    setPath(["mochila"], [...(data.mochila || []), novoItemMochila]);
    const valor = extrairValorNumerico(item.preco);
    if (valor > 0) setPath(["ouro"], Math.max(0, (data.ouro || 0) - valor));
  };

  return React.createElement(React.Fragment, null,
    React.createElement(SectionCard, {icon: Store, title: "Lojas", subtitle: "lojas liberadas pelo mestre — toque numa foto para ampliar, ou compre direto pra sua mochila", accent: "#a97d4c"},
      carregando && visiveis.length === 0 && React.createElement("p", {className: "mestre-empty"}, "Carregando…"),
      !carregando && visiveis.length === 0 && React.createElement("p", {className: "mestre-empty"}, "Nenhuma loja liberada para você ainda."),
      visiveis.map(cat => React.createElement("div", {key: cat.id, className: "loja-categoria-block"},
        React.createElement("h4", {className: "loja-categoria-title"}, cat.nome || "Sem nome"),
        cat.lojas.map(loja => React.createElement("div", {key: loja.id, className: "loja-block"},
          React.createElement("div", {className: "loja-nome"}, loja.nome || "Loja sem nome"),
          (loja.itens || []).length === 0
            ? React.createElement("p", {className: "mestre-empty"}, "Esta loja ainda não tem itens.")
            : (loja.itens || []).map(item => React.createElement(ItemLojaCard, {
                key: item.id, item, onAbrir: () => setItemAberto(item),
                onComprar: data && setPath ? comprarItem : null,
                ouroDisponivel: data ? (data.ouro || 0) : null
              }))
        ))
      ))
    ),
    itemAberto && React.createElement(ItemLojaExpandido, {item: itemAberto, onClose: () => setItemAberto(null)})
  );
}

// Visão do mestre: cria/edita categorias, lojas dentro de cada categoria e itens dentro de cada loja,
// além de escolher quais personagens têm acesso a cada loja
function LojasMestre() {
  const [categorias, setCategorias] = useState([]);
  const [personagens, setPersonagens] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [itemAberto, setItemAberto] = useState(null);
  const [novaCategoriaNome, setNovaCategoriaNome] = useState("");
  const [editandoPermLoja, setEditandoPermLoja] = useState(null);

  const carregar = useCallback(async () => {
    setCarregando(true);
    setCategorias(await carregarLojasIndex());
    try {
      const r = await window.storage.get("ficha-index", true);
      setPersonagens(r && r.value ? JSON.parse(r.value) : []);
    } catch (e) {
      setPersonagens([]);
    }
    setCarregando(false);
  }, []);

  useEffect(() => { carregar(); }, [carregar]);

  const persistir = async nova => {
    setCategorias(nova);
    try { await salvarLojasIndex(nova); } catch (e) {}
  };

  const adicionarCategoria = () => {
    const nome = novaCategoriaNome.trim() || "Nova categoria";
    persistir([...categorias, {id: uid(), nome, lojas: []}]);
    setNovaCategoriaNome("");
  };
  const renomearCategoria = (catId, nome) => persistir(categorias.map(c => c.id === catId ? {...c, nome} : c));
  const removerCategoria = catId => {
    if (!window.confirm("Remover esta categoria e todas as lojas dentro dela? Isso não pode ser desfeito.")) return;
    persistir(categorias.filter(c => c.id !== catId));
  };

  const adicionarLoja = catId => persistir(categorias.map(c => c.id === catId
    ? {...c, lojas: [...(c.lojas || []), {id: uid(), nome: "Nova loja", permitidos: [], itens: []}]}
    : c));
  const renomearLoja = (catId, lojaId, nome) => persistir(categorias.map(c => c.id !== catId ? c : {...c, lojas: c.lojas.map(l => l.id === lojaId ? {...l, nome} : l)}));
  const removerLoja = (catId, lojaId) => {
    if (!window.confirm("Remover esta loja e todos os itens dela? Isso não pode ser desfeito.")) return;
    persistir(categorias.map(c => c.id !== catId ? c : {...c, lojas: c.lojas.filter(l => l.id !== lojaId)}));
  };
  const alternarPermissaoLoja = (catId, lojaId, charId) => persistir(categorias.map(c => c.id !== catId ? c : {
    ...c, lojas: c.lojas.map(l => {
      if (l.id !== lojaId) return l;
      const atual = l.permitidos || [];
      const tem = atual.includes(charId);
      return {...l, permitidos: tem ? atual.filter(x => x !== charId) : [...atual, charId]};
    })
  }));
  const liberarTodosLoja = (catId, lojaId) => persistir(categorias.map(c => c.id !== catId ? c : {...c, lojas: c.lojas.map(l => l.id === lojaId ? {...l, permitidos: []} : l)}));

  const adicionarItem = (catId, lojaId) => persistir(categorias.map(c => c.id !== catId ? c : {
    ...c, lojas: c.lojas.map(l => l.id !== lojaId ? l : {...l, itens: [...(l.itens || []), {id: uid(), nome: "", preco: "", precoVenda: "", descricao: "", imagem: null}]})
  }));
  const atualizarItem = (catId, lojaId, itemId, patch) => persistir(categorias.map(c => c.id !== catId ? c : {
    ...c, lojas: c.lojas.map(l => l.id !== lojaId ? l : {...l, itens: l.itens.map(i => i.id === itemId ? {...i, ...patch} : i)})
  }));
  const removerItem = (catId, lojaId, itemId) => persistir(categorias.map(c => c.id !== catId ? c : {
    ...c, lojas: c.lojas.map(l => l.id !== lojaId ? l : {...l, itens: l.itens.filter(i => i.id !== itemId)})
  }));

  return React.createElement(React.Fragment, null,
    React.createElement(SectionCard, {icon: Store, title: "Nova categoria", subtitle: "ex: Armas, Armaduras, Itens Mágicos, Máscaras…", accent: "#a97d4c"},
      React.createElement("div", {style: {display: "flex", gap: 8}},
        React.createElement("input", {className: "field", value: novaCategoriaNome, onChange: e => setNovaCategoriaNome(e.target.value), placeholder: "nome da categoria", style: {flex: 1}}),
        React.createElement("button", {className: "add-row", onClick: adicionarCategoria}, React.createElement(Plus, {size: 13}), " criar")
      )
    ),
    carregando && React.createElement("p", {className: "mestre-empty"}, "Carregando…"),
    !carregando && categorias.length === 0 && React.createElement("p", {className: "mestre-empty"}, "Nenhuma categoria criada ainda."),
    !carregando && categorias.map(cat => React.createElement(SectionCard, {key: cat.id, icon: Store, title: cat.nome || "Sem nome", accent: "#a97d4c"},
      React.createElement("div", {className: "list-row", style: {marginBottom: 14}},
        React.createElement(EditableField, {value: cat.nome, onChange: v => renomearCategoria(cat.id, v), className: "list-input", placeholder: "nome da categoria"}),
        React.createElement("button", {className: "row-remove", onClick: () => removerCategoria(cat.id), "aria-label": "remover categoria"}, React.createElement(X, {size: 14}))
      ),
      (cat.lojas || []).length === 0 && React.createElement("p", {className: "mestre-empty"}, "Nenhuma loja nesta categoria ainda."),
      (cat.lojas || []).map(loja => React.createElement("div", {key: loja.id, className: "loja-mestre-block"},
        React.createElement("div", {className: "list-row", style: {marginBottom: 8}},
          React.createElement(EditableField, {value: loja.nome, onChange: v => renomearLoja(cat.id, loja.id, v), className: "list-input", placeholder: "nome da loja", style: {fontFamily: "Cinzel, serif"}}),
          React.createElement("button", {className: "row-remove", onClick: () => removerLoja(cat.id, loja.id), "aria-label": "remover loja"}, React.createElement(X, {size: 14}))
        ),
        React.createElement("div", {className: "galeria-card-actions", style: {marginBottom: 8, justifyContent: "flex-start"}},
          React.createElement("button", {
            className: "galeria-card-perm-btn", style: {flex: "none"},
            onClick: () => setEditandoPermLoja(editandoPermLoja === loja.id ? null : loja.id)
          }, (!loja.permitidos || loja.permitidos.length === 0) ? "visível a todos" : `${loja.permitidos.length} jogador(es)`)
        ),
        editandoPermLoja === loja.id && React.createElement("div", {className: "galeria-perm-list", style: {marginBottom: 10}},
          React.createElement("button", {
            className: "galeria-perm-item" + ((!loja.permitidos || loja.permitidos.length === 0) ? " active" : ""),
            onClick: () => liberarTodosLoja(cat.id, loja.id)
          }, "Todos os jogadores"),
          personagens.length === 0 && React.createElement("p", {className: "mestre-empty"}, "Nenhum personagem compartilhado ainda."),
          personagens.map(p => React.createElement("button", {
            key: p.charId,
            className: "galeria-perm-item" + ((loja.permitidos || []).includes(p.charId) ? " active" : ""),
            onClick: () => alternarPermissaoLoja(cat.id, loja.id, p.charId)
          }, p.nome || "Sem nome"))
        ),
        (loja.itens || []).map(item => React.createElement(ItemLojaEditor, {
          key: item.id, item,
          onChange: patch => atualizarItem(cat.id, loja.id, item.id, patch),
          onRemove: () => removerItem(cat.id, loja.id, item.id),
          onAbrir: () => setItemAberto(item)
        })),
        React.createElement("button", {className: "add-row", onClick: () => adicionarItem(cat.id, loja.id)}, React.createElement(Plus, {size: 13}), " adicionar item")
      )),
      React.createElement("button", {className: "add-row", style: {marginTop: 4, borderColor: "#a97d4c"}, onClick: () => adicionarLoja(cat.id)}, React.createElement(Plus, {size: 13}), " adicionar loja nesta categoria")
    )),
    itemAberto && React.createElement(ItemLojaExpandido, {item: itemAberto, onClose: () => setItemAberto(null)})
  );
}

// sem teto — a perícia nunca "trava" ou "conquista" nada, só continua subindo de nível
// enquanto o jogador treina. Os dois números-base (custo do 1º nível e o incremento) são
// configuráveis pelo mestre (compartilhados entre todos os personagens) — muito importante
// pra rebalancear a mesa se for preciso, sem precisar mexer no código.
const CONFIG_NIVEL_PADRAO = {base: 200, incremento: 100};
let TREINO_BASE = CONFIG_NIVEL_PADRAO.base;
let TREINO_INCREMENTO = CONFIG_NIVEL_PADRAO.incremento;
function aplicarConfigNivel(cfg) {
  const c = cfg || {};
  const base = Math.max(1, parseInt(c.base, 10) || CONFIG_NIVEL_PADRAO.base);
  const incremento = Math.max(0, parseInt(c.incremento, 10) || 0);
  TREINO_BASE = base;
  TREINO_INCREMENTO = incremento;
  return {base, incremento};
}
async function carregarConfigNivel() {
  try {
    const r = await window.storage.get("arvore-config-nivel", true);
    if (!r || !r.value) return {...CONFIG_NIVEL_PADRAO};
    return {...CONFIG_NIVEL_PADRAO, ...JSON.parse(r.value)};
  } catch (e) {
    return {...CONFIG_NIVEL_PADRAO};
  }
}
async function salvarConfigNivel(cfg) {
  try { await window.storage.set("arvore-config-nivel", JSON.stringify(cfg), true); } catch (e) {}
}
// Quanto falta treinar pra passar do nível N pro N+1, usando base/incremento — pode vir de
// um override específico da perícia (2º/3º argumento) ou da config global.
function custoDoNivel(nivel, base, incremento) {
  return base + (nivel - 1) * incremento;
}
// Dado o total de treino acumulado, calcula o nível atual e quanto falta pro próximo.
function nivelDoTreinamento(treinamento, base, incremento) {
  base = base || TREINO_BASE;
  incremento = incremento != null ? incremento : TREINO_INCREMENTO;
  let nivel = 1, acumulado = 0, custo = custoDoNivel(1, base, incremento);
  while (treinamento >= acumulado + custo) {
    acumulado += custo;
    nivel++;
    custo = custoDoNivel(nivel, base, incremento);
  }
  return {nivel, treinoAtual: treinamento - acumulado, treinoProximo: custo};
}

// Progresso padrão de uma perícia que ainda não recebeu nenhum treinamento.
function progressoPadrao() {
  return {treinamento: 0, historico: []};
}
function progressoDe(periciasAtributo, id) {
  const p = periciasAtributo && periciasAtributo[id];
  if (!p) return progressoPadrao();
  return {treinamento: Math.max(0, p.treinamento || 0), historico: p.historico || []};
}

// Registra treinamento numa perícia específica dentro do objeto de perícias de UM atributo
// (ex.: data.arvorePericias.forca). Sem teto — o nível é só uma leitura do total acumulado.
// Preserva o histórico com motivo opcional (ex.: concedido pelo mestre por um feito
// narrativo). Preparado para futuramente ser chamado por ações da aventura.
function addTrainingToAtributo(periciasAtributo, skillId, quantidade, motivo) {
  if (quantidade <= 0) return periciasAtributo;
  const atual = progressoDe(periciasAtributo, skillId);
  const novoTreinamento = atual.treinamento + quantidade;
  const entrada = {id: uid(), quantidade, motivo: motivo || "", em: Date.now()};
  return {
    ...(periciasAtributo || {}),
    [skillId]: {treinamento: novoTreinamento, historico: [...(atual.historico || []), entrada]}
  };
}

// O mestre libera ou bloqueia cada perícia manualmente, por personagem (arvoreDesbloqueios) —
// não existe mais cadeia de pré-requisitos: toda perícia começa bloqueada até o mestre liberar.
function skillLiberada(desbloqueiosAtributo, id) {
  return !!(desbloqueiosAtributo && desbloqueiosAtributo[id]);
}
function estadoNoArvore(skills, periciasAtributo, id, desbloqueiosAtributo) {
  if (!skillLiberada(desbloqueiosAtributo, id)) return "bloqueada";
  const prog = progressoDe(periciasAtributo, id);
  return prog.treinamento > 0 ? "treinando" : "disponivel";
}
const ESTADO_INFO = {
  bloqueada: {emoji: "\u{1F512}", label: "Bloqueada", cor: "#5f5644"},
  disponivel: {emoji: "\u{1F7E1}", label: "Disponível", cor: "#d9a13c"},
  treinando: {emoji: "\u{1F7E2}", label: "Em treinamento", cor: "#5f8a4e"}
};

// Lógica compartilhada: quais perícias da Árvore o personagem já começou a treinar e que
// continuam liberadas agora — usada pelo resumo do mestre (ResumoCard).
function periciasIniciadasPorAtributo(data) {
  const arvorePericias = data.arvorePericias || {};
  const arvoreDesbloqueios = data.arvoreDesbloqueios || {};
  return ORDEM_ATRIBUTOS_ARVORE.map(atr => {
    const arvore = skillTrees[atr];
    const periciasAtributo = arvorePericias[atr] || {};
    const desbloqueiosAtributo = arvoreDesbloqueios[atr] || {};
    const iniciadas = Object.keys(arvore.skills).filter(id => {
      if (estadoNoArvore(arvore.skills, periciasAtributo, id, desbloqueiosAtributo) === "bloqueada") return false;
      const p = progressoDe(periciasAtributo, id);
      return p.treinamento > 0;
    });
    return {atr, arvore, periciasAtributo, desbloqueiosAtributo, itens: iniciadas};
  }).filter(g => g.itens.length > 0);
}

// editáveis pelo mestre e compartilhados entre todos os personagens — mesmo padrão de

function ArvoreTab({data, setPath, souMestre}) {
  const [atributo, setAtributo] = useState("forca");
  const [registrandoId, setRegistrandoId] = useState(null);
  const [overrides, setOverrides] = useState({});
  const [customizadas, setCustomizadas] = useState({});
  const [configNivel, setConfigNivel] = useState(CONFIG_NIVEL_PADRAO);
  const [configAberta, setConfigAberta] = useState(false);
  const [novaAberta, setNovaAberta] = useState(false);
  const [novaNome, setNovaNome] = useState("");
  const [novaDescricao, setNovaDescricao] = useState("");
  const [avisoUso, setAvisoUso] = useState(null);

  useEffect(() => {
    let vivo = true;
    carregarArvoreOverrides().then(o => { if (vivo) setOverrides(o); });
    carregarPericiasCustomizadas().then(c => { if (vivo) setCustomizadas(c); });
    carregarConfigNivel().then(c => {
      if (!vivo) return;
      aplicarConfigNivel(c);
      setConfigNivel(c);
    });
    return () => { vivo = false; };
  }, []);

  // Toda vez que a config muda (carregada ou editada pelo mestre), reaplica nas variáveis
  // que o resto da árvore lê — assim o custo de treino por nível e a liberação de
  // pré-requisito refletem a quantidade escolhida sem precisar passar isso adiante em cada
  // função.
  useEffect(() => { aplicarConfigNivel(configNivel); }, [configNivel]);

  const editarConfigNivel = (campo, valor) => {
    const novo = {...configNivel, [campo]: valor};
    setConfigNivel(novo);
    salvarConfigNivel(novo);
  };

  const arvore = skillTrees[atributo];
  const skillsBase = arvore.skills;
  const skillsCustomizadasAtributo = customizadas[atributo] || {};
  const skills = {...skillsBase, ...skillsCustomizadasAtributo};
  const ids = Object.keys(skills).filter(id => !(overrides[id] && overrides[id].removida));
  const arvorePericias = data.arvorePericias || {};
  const periciasAtributo = arvorePericias[atributo] || {};
  const arvoreDesbloqueios = data.arvoreDesbloqueios || {};
  const desbloqueiosAtributo = arvoreDesbloqueios[atributo] || {};
  // Liberar/bloquear uma perícia pra este personagem específico — só o mestre chama isso.
  const alternarDesbloqueioFundamento = skillId => {
    const atual = arvoreDesbloqueios[atributo] || {};
    const ligado = !!atual[skillId];
    setPath(["arvoreDesbloqueios", atributo], {...atual, [skillId]: !ligado});
  };

  const registrarTreinamento = (skillId, quantidade, motivo) => {
    const atualDoAtributo = (data.arvorePericias || {})[atributo] || {};
    const novo = addTrainingToAtributo(atualDoAtributo, skillId, quantidade, motivo);
    setPath(["arvorePericias", atributo], novo);
  };
  const definirTreinamento = (skillId, valor) => {
    const atualDoAtributo = (data.arvorePericias || {})[atributo] || {};
    const atual = progressoDe(atualDoAtributo, skillId);
    setPath(["arvorePericias", atributo], {...atualDoAtributo, [skillId]: {...atual, treinamento: valor}});
  };
  const editarCatalogo = (skillId, campo, valor) => {
    setOverrides(prev => {
      const novo = {...prev, [skillId]: {...(prev[skillId] || {}), [campo]: valor}};
      salvarArvoreOverrides(novo);
      return novo;
    });
  };
  const editarDescricaoAtributo = valor => {
    setOverrides(prev => {
      const chave = "attr:" + atributo;
      const novo = {...prev, [chave]: {...(prev[chave] || {}), descricao: valor}};
      salvarArvoreOverrides(novo);
      return novo;
    });
  };

  // Vigor/fadiga: usar uma perícia gasta o custo dela, subtraindo do vigor que resta pro
  // personagem (fadiga.atual = vigor disponível agora, começa cheio em fadiga.max e vai
  // descendo) — se não sobrar vigor suficiente, a ação é bloqueada. Usar também concede XP
  // pro nível geral do personagem (mesma barra de "Nível" do topo da ficha).
  const vigorInsuficiente = custo => data.fadiga.atual - custo < 0;
  const usarPericia = (skillId, custo, nomePericia) => {
    if (vigorInsuficiente(custo)) {
      setAvisoUso(`Vigor insuficiente pra usar ${nomePericia}.`);
      setTimeout(() => setAvisoUso(null), 2500);
      return;
    }
    setPath(["fadiga", "atual"], Math.max(0, data.fadiga.atual - custo));
    ganharXpNivel(setPath, data);
    setAvisoUso(`${nomePericia} usada${custo > 0 ? ` (-${custo} vigor)` : ""} · +${XP_POR_USO_LABEL} XP de nível.`);
    setTimeout(() => setAvisoUso(null), 2000);
  };

  // Mestre cria uma perícia nova, além das 126 originais — some ao catálogo desse atributo.
  // Sem categoria e sem pré-requisito: ela nasce bloqueada e o mestre libera manualmente,
  // igual a qualquer outra perícia.
  const criarPericiaCustomizada = () => {
    const nome = novaNome.trim();
    if (!nome) return;
    const id = "custom_" + uid();
    const nova = {
      icone: "\u2B50", nome, prerequisitos: [], descricao: novaDescricao.trim(), efeito: novaDescricao.trim()
    };
    setCustomizadas(prev => {
      const novoAtributo = {...(prev[atributo] || {}), [id]: nova};
      const novo = {...prev, [atributo]: novoAtributo};
      salvarPericiasCustomizadas(novo);
      return novo;
    });
    setNovaNome(""); setNovaDescricao(""); setNovaAberta(false);
  };
  const removerPericiaCustomizada = skillId => {
    if (!window.confirm("Remover esta perícia customizada? O progresso de treino nela se perde.")) return;
    setCustomizadas(prev => {
      const novoAtributo = {...(prev[atributo] || {})};
      delete novoAtributo[skillId];
      const novo = {...prev, [atributo]: novoAtributo};
      salvarPericiasCustomizadas(novo);
      return novo;
    });
  };
  // Perícia do catálogo original (uma das 126) não pode ser apagada do código, mas o mestre
  // pode excluí-la da árvore visível pra todo mundo — fica marcada como "removida" junto dos
  // outros overrides compartilhados (mesmo armazenamento de nome/ícone/custo).
  const removerPericiaDoCatalogo = skillId => {
    if (!window.confirm("Excluir esta perícia da árvore? Ela deixa de aparecer pra todos os personagens (pode ser desfeito removendo o override depois).")) return;
    editarCatalogo(skillId, "removida", true);
  };
  const excluirPericia = skillId => {
    if (skillsCustomizadasAtributo[skillId]) removerPericiaCustomizada(skillId);
    else removerPericiaDoCatalogo(skillId);
  };

  const totalTreinamentos = ids.reduce((acc, id) => acc + (progressoDe(periciasAtributo, id).historico || []).length, 0);
  const overrideAtributo = overrides["attr:" + atributo] || {};
  const descricaoAtributoAtual = overrideAtributo.descricao !== undefined ? overrideAtributo.descricao : arvore.descricaoAtributo;

  const skillRegistrando = registrandoId && skills[registrandoId];

  return React.createElement(React.Fragment, null,
    React.createElement(SectionCard, {
      icon: TreeIcon, title: "Árvore de Perícias", subtitle: "cada perícia evolui com o próprio treinamento — sem pontos, sem XP global",
      accent: arvore.cor
    },
      React.createElement("div", {className: "arvore-seletor"},
        ORDEM_ATRIBUTOS_ARVORE.map(chave => React.createElement("button", {
          key: chave,
          className: "arvore-seletor-btn-icone" + (chave === atributo ? " active" : ""),
          style: chave === atributo ? {borderColor: skillTrees[chave].cor, boxShadow: `0 0 10px ${skillTrees[chave].cor}55`} : {},

// Atalho rápido pro jogador: mostra as perícias já iniciadas (com pelo menos 1 treino),
// agrupadas por atributo, com o custo de vigor de cada uma — sem precisar entrar na aba
// Árvore. Toca no botão e já usa a perícia (mesmo efeito de "usar" de lá: soma o custo na
// fadiga). Carrega os mesmos overrides/perícias customizadas compartilhados da árvore.
function PericiasAtalho({data, setPath, souMestre}) {
  const [overrides, setOverrides] = useState({});
  const [customizadas, setCustomizadas] = useState({});

  useEffect(() => {
    let vivo = true;
    carregarArvoreOverrides().then(o => { if (vivo) setOverrides(o); });
    carregarPericiasCustomizadas().then(c => { if (vivo) setCustomizadas(c); });
    return () => { vivo = false; };
  }, []);

  const arvorePericias = data.arvorePericias || {};
  const arvoreDesbloqueios = data.arvoreDesbloqueios || {};

  const grupos = ORDEM_ATRIBUTOS_ARVORE.map(atr => {
    const arvore = skillTrees[atr];
    const skillsCustomizadasAtributo = customizadas[atr] || {};
    const skills = {...arvore.skills, ...skillsCustomizadasAtributo};
    const periciasAtributo = arvorePericias[atr] || {};
    const desbloqueiosAtributo = arvoreDesbloqueios[atr] || {};
    const itens = Object.keys(skills).filter(id => {
      if (overrides[id] && overrides[id].removida) return false;
      if (estadoNoArvore(skills, periciasAtributo, id, desbloqueiosAtributo) === "bloqueada") return false;
      return progressoDe(periciasAtributo, id).treinamento > 0;
    }).map(id => {
      const overrideSkill = overrides[id] || {};
      const nivelPericia = nivelDoTreinamento(progressoDe(periciasAtributo, id).treinamento).nivel;
      return {
        id,
        nome: overrideSkill.nome !== undefined ? overrideSkill.nome : skills[id].nome,
        custoVigor: Math.max(0, parseInt(overrideSkill.custoVigor, 10) || 0),
        dado: dadoPorNivel(nivelPericia)
      };
    });
    return {atr, nome: arvore.nome, cor: arvore.cor, itens};
  }).filter(g => g.itens.length > 0);

  const vigorInsuficiente = custo => data.fadiga.atual - custo < 0;
  const usar = it => {
    if (vigorInsuficiente(it.custoVigor)) return;
    setPath(["fadiga", "atual"], Math.max(0, data.fadiga.atual - it.custoVigor));
    ganharXpNivel(setPath, data);
  };

  if (souMestre || grupos.length === 0) return null;

  return React.createElement(SectionCard, {
    icon: TreeIcon, title: "Perícias", subtitle: "atalho rápido — toque pra usar (gasta o vigor dela)", accent: "#a97d4c"
  },
    grupos.map(g => React.createElement("div", {key: g.atr, style: {marginBottom: 10}},
      React.createElement("span", {className: "pericia-atalho-grupo-nome", style: {color: g.cor}}, g.nome),
      React.createElement("div", {style: {display: "flex", flexWrap: "wrap", gap: 6}},
        g.itens.map(it => React.createElement("button", {
          key: it.id,
          className: "pericia-atalho-btn" + (vigorInsuficiente(it.custoVigor) ? " sem-vigor" : ""),
          style: {borderColor: g.cor},
          onClick: () => usar(it)
        },
          it.nome,
          React.createElement("span", {className: "pericia-atalho-dado", style: {color: g.cor}}, it.dado.notacao),
          React.createElement("span", {className: "pericia-atalho-custo"}, it.custoVigor > 0 ? `-${it.custoVigor} vigor` : "grátis")
        ))
      )
    ))
  );
}

// Cores fixas por atributo (Força, Agilidade, Inteligência, Carisma, Magia).
// Compara o nome sem acento/caixa pra não quebrar se alguém digitar diferente;
// atributos fora dessa lista (customizados) mantêm o dourado padrão.
const CORES_ATRIBUTOS = {
  forca: "#9c2b2b",
  agilidade: "#4c9a55",
  inteligencia: "#6fb3e0",
  carisma: "#d9689f",
  magia: "#8a5fc9"
};
function normalizarNome(s) {
  return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();
}
function corAtributo(nome) {
  return CORES_ATRIBUTOS[normalizarNome(nome)] || "#a97d4c";
}

// Abreviação curta pro nome do atributo — usada no resumo pra deixar os quadrinhos
// todos do mesmo tamanho. Atributo customizado (fora dos 5 padrão) vira as 3 primeiras letras.
const ABREVIACOES_ATRIBUTOS = {
  forca: "FOR", agilidade: "AGL", inteligencia: "INT", carisma: "CAR", magia: "MAG"
};
function abreviarAtributo(nome) {
  return ABREVIACOES_ATRIBUTOS[normalizarNome(nome)] || (nome || "?").slice(0, 3).toUpperCase();
}
async function carregarMapaIndex() {
  try {
    const r = await window.storage.get("mapa-index", true);
    if (!r || !r.value) return {mapas: []};
    const dados = JSON.parse(r.value);
    if (Array.isArray(dados.mapas)) return dados;
    // formato antigo (um mapa único direto no objeto raiz) — migra pra um item da lista
    if (dados.imagem || (dados.marcadores && dados.marcadores.length)) {
      return {mapas: [{id: uid(), nome: "Mapa 1", imagem: dados.imagem || null, permitidos: [], marcadores: dados.marcadores || []}]};
    }
    return {mapas: []};
  } catch (e) {
    return {mapas: []};
  }
}

  await window.storage.set("mapa-index", JSON.stringify(indice), true);

// Expande a imagem do mapa em tela cheia, com zoom e arraste para o jogador conseguir
// examinar todos os cantos do mapa em detalhe.
const MAPA_ZOOM_MIN = 1;
const MAPA_ZOOM_MAX = 6;

function MapaImagemExpandida({mapa, onClose}) {
  const viewportRef = React.useRef(null);
  const imgRef = React.useRef(null);
  const [scale, setScale] = React.useState(1);
  const [pos, setPos] = React.useState({x: 0, y: 0});
  const stateRef = React.useRef({scale: 1, pos: {x: 0, y: 0}});
  const arrasteRef = React.useRef(null);
  const pinchRef = React.useRef(null);
  const [arrastando, setArrastando] = React.useState(false);

  React.useEffect(() => { stateRef.current = {scale, pos}; }, [scale, pos]);

  const clampPos = React.useCallback((novoScale, novoPos) => {
    const vp = viewportRef.current, img = imgRef.current;
    if (!vp || !img) return novoPos;
    const vw = vp.clientWidth, vh = vp.clientHeight;
    const iw = img.naturalWidth ? (vw * novoScale) : vw * novoScale;
    // largura/altura real da imagem renderizada nessa escala (base = largura do viewport)
    const baseH = img.naturalWidth ? (vw * (img.naturalHeight / img.naturalWidth)) : vh;
    const w = vw * novoScale, h = baseH * novoScale;
    const minX = Math.min(0, vw - w), minY = Math.min(0, vh - h);
    return {
      x: Math.max(minX, Math.min(0, novoPos.x)),
      y: Math.max(minY, Math.min(0, novoPos.y))
    };
  }, []);

  const aplicarZoom = React.useCallback((novoScaleBruto, focoClienteX, focoClienteY) => {
    const vp = viewportRef.current;
    if (!vp) return;
    const novoScale = Math.max(MAPA_ZOOM_MIN, Math.min(MAPA_ZOOM_MAX, novoScaleBruto));
    const {scale: atual, pos: posAtual} = stateRef.current;
    if (novoScale === atual) return;
    const rect = vp.getBoundingClientRect();
    const fx = (focoClienteX == null ? rect.width / 2 : focoClienteX - rect.left);
    const fy = (focoClienteY == null ? rect.height / 2 : focoClienteY - rect.top);
    const razao = novoScale / atual;
    const novoPosBruto = {x: fx - (fx - posAtual.x) * razao, y: fy - (fy - posAtual.y) * razao};
    const novoPos = novoScale <= MAPA_ZOOM_MIN ? {x: 0, y: 0} : clampPos(novoScale, novoPosBruto);
    setScale(novoScale);
    setPos(novoPos);
  }, [clampPos]);

  const zoomIn = () => aplicarZoom(stateRef.current.scale * 1.5);
  const zoomOut = () => aplicarZoom(stateRef.current.scale / 1.5);
  const resetZoom = () => { setScale(1); setPos({x: 0, y: 0}); };

  // roda do mouse / trackpad
  React.useEffect(() => {
    const vp = viewportRef.current;
    if (!vp) return;
    const onWheel = e => {
      e.preventDefault();
      const fator = Math.exp(-e.deltaY * 0.0018);
      aplicarZoom(stateRef.current.scale * fator, e.clientX, e.clientY);
    };
    vp.addEventListener("wheel", onWheel, {passive: false});
    return () => vp.removeEventListener("wheel", onWheel);
  }, [aplicarZoom]);

  // arraste com mouse
  const onMouseDown = e => {
    if (stateRef.current.scale <= MAPA_ZOOM_MIN) return;
    arrasteRef.current = {startX: e.clientX, startY: e.clientY, origPos: stateRef.current.pos};
    setArrastando(true);
  };
  React.useEffect(() => {
    const onMove = e => {
      if (!arrasteRef.current) return;
      const {startX, startY, origPos} = arrasteRef.current;
      const novoPos = {x: origPos.x + (e.clientX - startX), y: origPos.y + (e.clientY - startY)};
      setPos(clampPos(stateRef.current.scale, novoPos));
    };
    const onUp = () => { arrasteRef.current = null; setArrastando(false); };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    return () => { window.removeEventListener("mousemove", onMove); window.removeEventListener("mouseup", onUp); };
  }, [clampPos]);

  // toque: arraste com um dedo, pinça com dois
  const distanciaToques = ts => Math.hypot(ts[0].clientX - ts[1].clientX, ts[0].clientY - ts[1].clientY);
  const centroToques = ts => ({x: (ts[0].clientX + ts[1].clientX) / 2, y: (ts[0].clientY + ts[1].clientY) / 2});

  const onTouchStart = e => {
    if (e.touches.length === 2) {
      pinchRef.current = {dist: distanciaToques(e.touches), scale: stateRef.current.scale, pos: stateRef.current.pos, centro: centroToques(e.touches)};
      arrasteRef.current = null;
    } else if (e.touches.length === 1) {
      const t = e.touches[0];
      arrasteRef.current = {startX: t.clientX, startY: t.clientY, origPos: stateRef.current.pos};
    }
  };
  const onTouchMove = e => {
    if (e.touches.length === 2 && pinchRef.current) {
      e.preventDefault();
      const novaDist = distanciaToques(e.touches);
      const razao = novaDist / pinchRef.current.dist;
      const novoScale = Math.max(MAPA_ZOOM_MIN, Math.min(MAPA_ZOOM_MAX, pinchRef.current.scale * razao));
      const vp = viewportRef.current;
      const rect = vp.getBoundingClientRect();
      const centro = centroToques(e.touches);
      const fx = centro.x - rect.left, fy = centro.y - rect.top;
      const razaoAplicada = novoScale / pinchRef.current.scale;
      const novoPosBruto = {
        x: fx - (fx - pinchRef.current.pos.x) * razaoAplicada,
        y: fy - (fy - pinchRef.current.pos.y) * razaoAplicada
      };
      const novoPos = novoScale <= MAPA_ZOOM_MIN ? {x: 0, y: 0} : clampPos(novoScale, novoPosBruto);
      setScale(novoScale);
      setPos(novoPos);
    } else if (e.touches.length === 1 && arrasteRef.current) {
      if (stateRef.current.scale <= MAPA_ZOOM_MIN) return;
      e.preventDefault();
      const t = e.touches[0];

// Agrupa marcadores muito próximos (mesma pequena área do mapa) em grupos.
// Usa distância percentual simples e agrupamento transitivo: se A está perto de B
// e B perto de C, os três entram no mesmo grupo, mesmo que A e C estejam um pouco mais longe.
const LIMIAR_AGRUPAMENTO = 5; // % da imagem — abaixo disso, marcadores são tratados como "colados"
function agruparMarcadoresProximos(marcadores, limiar) {
  const restantes = [...marcadores];
  const grupos = [];
  while (restantes.length) {
    const grupo = [restantes.shift()];
    let mudou = true;
    while (mudou) {
      mudou = false;
      for (let i = restantes.length - 1; i >= 0; i--) {
        const m = restantes[i];
        const perto = grupo.some(g => Math.hypot(g.x - m.x, g.y - m.y) <= limiar);
        if (perto) { grupo.push(m); restantes.splice(i, 1); mudou = true; }
      }
    }
    grupos.push(grupo);
  }
  return grupos;
}

// Caixa numérica editável usada para a fadiga (sem os botões de +10/-10). Mantém um texto
// local enquanto o usuário digita, pra permitir apagar o campo sem que ele volte pra "0"
// sozinho, e seleciona o conteúdo ao focar, pra digitar um número novo substitua o valor
// antigo em vez de grudar do lado (ex.: "0" virando "05").
function FadigaInput({valor, max, onDefinir, className}) {
  const [texto, setTexto] = useState(String(valor));
  useEffect(() => { setTexto(String(valor)); }, [valor]);
  const commit = v => {
    const n = Math.max(0, Math.min(max, parseInt(v, 10) || 0));
    onDefinir(n);
    setTexto(String(n));
  };
  return React.createElement("input", {
    type: "number", className: className || "field fadiga-input", value: texto,
    "aria-label": "definir fadiga exata",
    onFocus: e => e.target.select(),
    onChange: e => setTexto(e.target.value),
    onBlur: e => commit(e.target.value),
    onKeyDown: e => { if (e.key === "Enter") e.target.blur(); }
  });
}
// Editar o TETO de fadiga, digitando o número direto (sem botão de +1/-1) — o mestre escreve

// Gera um contorno irregular (blob) em clip-path, pra mancha de sangue não parecer um círculo perfeito
function gerarContornoBlob(nPontos, variancia) {
  const pontos = [];
  for (let i = 0; i < nPontos; i++) {
    const ang = (360 / nPontos) * i + (Math.random() * 10 - 5);
    const raio = 50 - variancia + Math.random() * variancia * 2;
    const x = 50 + raio * Math.cos(ang * Math.PI / 180);
    const y = 50 + raio * Math.sin(ang * Math.PI / 180);
    pontos.push(x.toFixed(1) + "% " + y.toFixed(1) + "%");
  }
  return "polygon(" + pontos.join(",") + ")";
}

// Gera os "impactos" de sangue: cada um é uma mancha central irregular + respingos menores
// voando pra fora dela em direções aleatórias, como se tivesse sido jogado na tela.
// Sempre no máximo (sem escala gradual) — a "piora" já fica por conta da vinheta permanente.
function gerarImpactosSangue() {
  const qtdImpactos = 4 + Math.floor(Math.random() * 3);
  const impactos = [];
  for (let i = 0; i < qtdImpactos; i++) {
    const nRespingos = 9 + Math.floor(Math.random() * 7);
    const respingos = Array.from({length: nRespingos}, (_, j) => {
      const ang = Math.random() * 360;
      const dist = 30 + Math.random() * 150;
      const rad = ang * Math.PI / 180;
      return {
        id: j, dx: Math.cos(rad) * dist, dy: Math.sin(rad) * dist,
        rot: ang, tamanho: 8 + Math.random() * 18, atraso: Math.random() * 0.18
      };
    });
    impactos.push({
      id: i, top: 8 + Math.random() * 80, left: 8 + Math.random() * 80,
      tamanho: 50 + Math.random() * 64, clip: gerarContornoBlob(9 + Math.floor(Math.random() * 3), 18),
      giro: Math.random() * 360, atraso: i * 0.1 + Math.random() * 0.08, respingos
    });
  }
  return impactos;
}

function MestreResumo({onAbrir}) {
  const [chars, setChars] = useState([]);
  const [carregando, setCarregando] = useState(true);
  // Guarda, por personagem, até quando devemos IGNORAR o que vier do polling automático
  // (pra não sobrescrever um clique recente antes da gravação terminar de propagar).
  const dirtyUntilRef = useRef({});
  // Guarda o timer + os dados mais recentes pendentes de gravação, por personagem —
  // assim, cliques rápidos em sequência colapsam numa única gravação final (com o valor
  // certo), em vez de várias gravações concorrentes que podem terminar fora de ordem.
  const pendentesRef = useRef({});

  const carregarTudo = useCallback(async (mostrarLoading) => {
    if (mostrarLoading) setCarregando(true);
    try {
      const r = await window.storage.get("ficha-index", true);
      const lista = r && r.value ? JSON.parse(r.value) : [];
      const agora = Date.now();
      const cheios = await Promise.all(lista.map(async p => {
        if ((dirtyUntilRef.current[p.charId] || 0) > agora) {
          return {charId: p.charId, manterLocal: true};
        }
        try {
          const rf = await window.storage.get(`ficha:${p.charId}`, true);
          const dados = rf && rf.value ? JSON.parse(rf.value) : null;
          if (!dados) return null;
          // normaliza o teto de fadiga pro valor atual do sistema, mesmo em fichas antigas
          dados.fadiga = {atual: (dados.fadiga && typeof dados.fadiga.atual === "number") ? dados.fadiga.atual : 0, max: DEFAULT_DATA.fadiga.max};
          return {charId: p.charId, dados};
        } catch (e) {
          return null;
        }
      }));
      setChars(prev => {
        const porId = {};
        prev.forEach(c => { porId[c.charId] = c; });
        const resultado = cheios
          .map(item => {
            if (!item) return null;
            if (item.manterLocal) return porId[item.charId] || null;
            return item;
          })
          .filter(Boolean);
        resultado.sort((a, b) => (a.dados.personagem?.nome || "").localeCompare(b.dados.personagem?.nome || ""));
        return resultado;
      });
    } catch (e) {
      setChars([]);
    } finally {
      setCarregando(false);
    }
  }, []);

  useEffect(() => {
    carregarTudo(true);
    const intervalId = setInterval(() => carregarTudo(false), 6000);
    return () => clearInterval(intervalId);
  }, [carregarTudo]);

  // Agenda a gravação de um personagem específico com um pequeno atraso: se chegar outro
  // clique antes disso, cancela o anterior e reagenda com o valor mais novo. Isso garante
  // que só existe UMA gravação em voo por personagem, sempre com o dado mais recente.
  const agendarGravacao = (charId, dados) => {
    dirtyUntilRef.current[charId] = Date.now() + 5000;
    const pendente = pendentesRef.current[charId];
    if (pendente && pendente.timer) clearTimeout(pendente.timer);
    pendentesRef.current[charId] = {
      dados,
      timer: setTimeout(async () => {
        const paraSalvar = pendentesRef.current[charId] && pendentesRef.current[charId].dados;
        try {
          if (paraSalvar) await window.storage.set(`ficha:${charId}`, JSON.stringify(paraSalvar), true);
        } catch (e) {
        } finally {
          dirtyUntilRef.current[charId] = Date.now() + 1200;
        }
      }, 450)
    };
  };

  // Ajusta um stat (vida, armadura, falhas ou fadiga) de UM personagem só, e agenda a gravação
  const ajustarStatChar = (charId, campo, delta) => {
    setChars(prev => prev.map(c => {
      if (c.charId !== charId) return c;
      const s = c.dados[campo] || {atual: 0, max: 0};
      const novoAtual = Math.min(s.max, Math.max(0, (s.atual || 0) + delta));
      const novosDados = {...c.dados, [campo]: {...s, atual: novoAtual}};
      agendarGravacao(charId, novosDados);
      return {...c, dados: novosDados};
    }));
  };

  // Define o valor exato de um stat (vida, armadura, falhas ou fadiga) de UM personagem,
  // sem precisar clicar +1/-1 várias vezes — usado pelo campo numérico ao lado dos botões
  const definirStatChar = (charId, campo, valor) => {
    setChars(prev => prev.map(c => {
      if (c.charId !== charId) return c;
      const s = c.dados[campo] || {atual: 0, max: 0};
      const novoAtual = Math.min(s.max, Math.max(0, valor));
      const novosDados = {...c.dados, [campo]: {...s, atual: novoAtual}};
      agendarGravacao(charId, novosDados);
      return {...c, dados: novosDados};
    }));
  };

  // Define a fadiga de TODO o grupo de uma vez, pro mesmo valor exato (cada um respeitando
  // seu próprio máximo)
  const definirFadigaGrupo = valor => {
    setChars(prev => prev.map(c => {
      const f = c.dados.fadiga || {atual: 0, max: DEFAULT_DATA.fadiga.max};
      const novoAtual = Math.min(f.max, Math.max(0, valor));
      const novosDados = {...c.dados, fadiga: {...f, atual: novoAtual}};
      agendarGravacao(c.charId, novosDados);
      return {...c, dados: novosDados};
    }));
  };

  // Ouro é um número simples (sem máximo), então ajusta/define direto — usado pelos
  // botões +/− e pelo campo numérico de cada personagem no Resumo.
  const ajustarOuroChar = (charId, delta) => {
    setChars(prev => prev.map(c => {
      if (c.charId !== charId) return c;
      const novosDados = {...c.dados, ouro: Math.max(0, (c.dados.ouro || 0) + delta)};
      agendarGravacao(charId, novosDados);
      return {...c, dados: novosDados};
    }));
  };
  const definirOuroChar = (charId, valor) => {
    setChars(prev => prev.map(c => {
      if (c.charId !== charId) return c;
      const novosDados = {...c.dados, ouro: Math.max(0, valor)};
      agendarGravacao(charId, novosDados);
      return {...c, dados: novosDados};
    }));
  };

  // Ajusta o nível da mochila de UM personagem (também sem máximo, igual ao ouro)
  const ajustarMochilaNivelChar = (charId, delta) => {
    setChars(prev => prev.map(c => {
      if (c.charId !== charId) return c;
      const novosDados = {...c.dados, mochilaNivel: Math.max(0, (c.dados.mochilaNivel || 0) + delta)};
      agendarGravacao(charId, novosDados);
      return {...c, dados: novosDados};
    }));
  };

  // Ajusta a quantidade de UM item específico da mochila de UM personagem
  const ajustarQuantidadeItemChar = (charId, itemId, delta) => {
    setChars(prev => prev.map(c => {
      if (c.charId !== charId) return c;
      const novaMochila = (c.dados.mochila || []).map(m => m.id === itemId ? {...m, quantidade: Math.max(1, (m.quantidade || 1) + delta)} : m);
      const novosDados = {...c.dados, mochila: novaMochila};
      agendarGravacao(charId, novosDados);
      return {...c, dados: novosDados};
    }));
  };

  return React.createElement(SectionCard, {icon: Users, title: "Resumo rápido", subtitle: "vida, armadura, falhas, fadiga, ouro, habilidades, inventário e itens de todos \u2014 atualiza sozinho a cada poucos segundos", accent: "#9c2b2b"},
    React.createElement("div", {className: "resumo-toolbar"},
      React.createElement("button", {className: "add-row", onClick: () => carregarTudo(true)}, React.createElement(RotateCcw, {size: 12}), " atualizar agora"),
      React.createElement("div", {className: "resumo-fadiga-grupo-box"},
        React.createElement("span", {className: "resumo-stat-label"}, "Fadiga do Grupo"),
        React.createElement(FadigaGrupoCustom, {onAplicar: definirFadigaGrupo, disabled: chars.length === 0})
      )
    ),
    carregando && chars.length === 0 && React.createElement("p", {className: "mestre-empty"}, "Carregando…"),
    !carregando && chars.length === 0 && React.createElement("p", {className: "mestre-empty"}, "Nenhum personagem compartilhado ainda."),
    chars.map(({charId, dados}) => React.createElement(ResumoCard, {
      key: charId, dados, charId,
      onAjustar: (campo, delta) => ajustarStatChar(charId, campo, delta),
      onDefinirFadiga: valor => definirStatChar(charId, "fadiga", valor),
      onAjustarOuro: delta => ajustarOuroChar(charId, delta),
      onDefinirOuro: valor => definirOuroChar(charId, valor),
      onAjustarMochilaNivel: delta => ajustarMochilaNivelChar(charId, delta),
      onAjustarQuantidadeItem: (itemId, delta) => ajustarQuantidadeItemChar(charId, itemId, delta),
      onAbrir: onAbrir ? () => onAbrir(charId) : null
    }))
  );
}
