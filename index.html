// ===================== BACKUPS DA FICHA =====================
// Cada personagem tem seu próprio histórico, guardado em "ficha-backups:<charId>" — mantém
// só os 5 mais recentes (manuais ou automáticos, sem distinção na poda: sempre que passar
// de 5, o mais antigo cai fora). O mestre cria um manualmente quando quiser (antes de mexer
// em algo ou começar uma sessão), e o sistema também cria um sozinho, automaticamente, na
// primeira vez que o mestre abre a ficha depois de um tempo — assim sempre existe um ponto
// de restauração recente mesmo se ele esquecer de criar um na mão.
const BACKUP_FICHA_MAX = 5;
const BACKUP_FICHA_INTERVALO_AUTO_MS = 6 * 60 * 60 * 1000; // no máximo 1 automático a cada 6h

async function carregarBackupsFicha(charId) {
  try {
    const r = await window.storage.get(`ficha-backups:${charId}`, true);
    return r && r.value ? JSON.parse(r.value) : [];
  } catch (e) {
    return [];
  }
}
async function salvarBackupsFicha(charId, lista) {
  await window.storage.set(`ficha-backups:${charId}`, JSON.stringify(lista), true);
}
async function criarBackupFicha(charId, dadosAtuais, tipo) {
  const lista = await carregarBackupsFicha(charId);
  const entrada = {id: uid(), criadoEm: Date.now(), tipo, dados: structuredClone(dadosAtuais)};
  const nova = [entrada, ...lista].sort((a, b) => b.criadoEm - a.criadoEm).slice(0, BACKUP_FICHA_MAX);
  await salvarBackupsFicha(charId, nova);
  return nova;
}
function formatarDataBackup(ts) {
  try {
    return new Date(ts).toLocaleString("pt-BR", {day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit"});
  } catch (e) {
    return "";
  }
}

// ===================== BACKUP GERAL (todos os personagens de uma vez) =====================
// Diferente do backup por ficha (que guarda o histórico de UM personagem), o backup geral
// tira uma "foto" de TODOS os personagens cadastrados no momento e guarda tudo junto numa
// única entrada — pensado pra antes de uma sessão, ou antes de mudanças grandes na árvore/
// catálogo que afetam todo mundo de uma vez. Guardado em "backup-geral-lista" (compartilhado).
const BACKUP_GERAL_MAX = 5;

async function carregarBackupsGerais() {
  try {
    const r = await window.storage.get("backup-geral-lista", true);
    return r && r.value ? JSON.parse(r.value) : [];
  } catch (e) {
    return [];
  }
}
async function salvarBackupsGerais(lista) {
  await window.storage.set("backup-geral-lista", JSON.stringify(lista), true);
}
// Lê a ficha-index (lista de personagens) e a ficha completa de cada um, empacotando tudo
// numa única entrada de backup geral.
async function criarBackupGeral(tipo) {
  const rIndex = await window.storage.get("ficha-index", true);
  const indice = rIndex && rIndex.value ? JSON.parse(rIndex.value) : [];
  const personagens = await Promise.all(indice.map(async p => {
    try {
      const rf = await window.storage.get(`ficha:${p.charId}`, true);
      const dados = rf && rf.value ? JSON.parse(rf.value) : null;
      return dados ? {charId: p.charId, nome: dados.personagem && dados.personagem.nome, dados} : null;
    } catch (e) {
      return null;
    }
  }));
  const entrada = {
    id: uid(), criadoEm: Date.now(), tipo,
    personagens: personagens.filter(Boolean)
  };
  const lista = await carregarBackupsGerais();
  const nova = [entrada, ...lista].sort((a, b) => b.criadoEm - a.criadoEm).slice(0, BACKUP_GERAL_MAX);
  await salvarBackupsGerais(nova);
  return nova;
}
// Restaura todos os personagens de UM backup geral, sobrescrevendo a ficha atual de cada um
// (por charId). Personagens criados DEPOIS desse backup (que não estavam nele) não são
// tocados nem apagados — a restauração só afeta quem já existia no momento da foto.
async function restaurarBackupGeral(entrada) {
  await Promise.all(entrada.personagens.map(p =>
    window.storage.set(`ficha:${p.charId}`, JSON.stringify(p.dados), true)
  ));
}
// Gera um arquivo .json pra download local — uma cópia de segurança fora do próprio app,
// útil antes de mudanças arriscadas ou só pra guardar em outro lugar.
function baixarBackupGeralComoArquivo(entrada) {
  const conteudo = JSON.stringify(entrada, null, 2);
  const blob = new Blob([conteudo], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `backup-geral-${new Date(entrada.criadoEm).toISOString().slice(0, 16).replace(/[:T]/g, "-")}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Painel da subaba "Backup Geral" — cria, lista, restaura, apaga e exporta backups de TODOS
// os personagens de uma vez.
function BackupGeralPainel() {
  const [backups, setBackups] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [criando, setCriando] = useState(false);
  const [erro, setErro] = useState("");

  const atualizar = useCallback(async () => {
    setCarregando(true);
    setBackups(await carregarBackupsGerais());
    setCarregando(false);
  }, []);

  useEffect(() => { atualizar(); }, [atualizar]);

  const criar = async () => {
    setCriando(true);
    setErro("");
    try {
      setBackups(await criarBackupGeral("manual"));
    } catch (e) {
      setErro("Não foi possível criar o backup geral agora.");
    } finally {
      setCriando(false);
    }
  };

  const restaurar = async entrada => {
    if (!window.confirm(
      `Restaurar o backup geral de ${formatarDataBackup(entrada.criadoEm)}? Isso substitui a ficha de ${entrada.personagens.length} personagem(ns) pelo estado que estava salvo nesse momento. Um novo backup do estado atual é criado automaticamente antes, por segurança.`
    )) return;
    try {
      await criarBackupGeral("automatico"); // salvaguarda do estado atual antes de sobrescrever
      await restaurarBackupGeral(entrada);
      await atualizar();
      window.alert("Backup geral restaurado. As fichas dos jogadores serão atualizadas na próxima sincronização deles.");

      setErro("Não foi possível restaurar esse backup geral.");

  const remover = async id => {

    const nova = backups.filter(b => b.id !== id);
    setBackups(nova);
    try { await salvarBackupsGerais(nova); } catch (e) {}
  };

  return React.createElement(SectionCard, {
    icon: Backup, title: "Backup Geral", accent: "#a97d4c",
    subtitle: "salva a ficha de TODOS os personagens de uma vez — use antes de uma sessão ou de mudanças grandes"
  },
    React.createElement("div", {style: {display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12}},
      React.createElement("button", {className: "add-row", style: {marginBottom: 0}, onClick: criar, disabled: criando},
        React.createElement(Backup, {size: 13}), criando ? " salvando…" : " criar backup geral agora"),
      React.createElement("button", {className: "add-row", style: {marginBottom: 0}, onClick: () => atualizar()},
        React.createElement(RotateCcw, {size: 12}), " atualizar lista")
    ),
    erro && React.createElement("p", {className: "mestre-empty"}, erro),
    carregando && React.createElement("p", {className: "mestre-empty"}, "Carregando…"),
    !carregando && backups.length === 0 && React.createElement("p", {className: "mestre-empty"}, "Nenhum backup geral ainda."),
    !carregando && backups.map(b => React.createElement("div", {key: b.id, className: "mestre-card", style: {cursor: "default"}},
      React.createElement("div", {style: {display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, flexWrap: "wrap"}},
        React.createElement("div", null,
          React.createElement("div", {className: "mestre-card-name"}, b.tipo === "manual" ? "\u{1F4CC} Manual" : "\u{1F550} Automático"),
          React.createElement("div", {className: "mestre-card-sub"}, formatarDataBackup(b.criadoEm), " — ", b.personagens.length, " personagem(ns)")
        ),
        React.createElement("div", {style: {display: "flex", gap: 6, flexWrap: "wrap"}},
          React.createElement("button", {className: "add-row", style: {marginBottom: 0, fontSize: 11, padding: "6px 10px"}, onClick: () => baixarBackupGeralComoArquivo(b)}, "baixar .json"),
          React.createElement("button", {className: "add-row", style: {marginBottom: 0, fontSize: 11, padding: "6px 10px"}, onClick: () => restaurar(b)}, "restaurar todos"),
          React.createElement("button", {className: "mestre-card-remove", onClick: () => remover(b.id), "aria-label": "apagar backup geral"}, React.createElement(X, {size: 16}))
        )
      ),
      React.createElement("div", {className: "mestre-card-sub", style: {marginTop: 6, opacity: 0.8}},
        b.personagens.map(p => p.nome || "sem nome").join(", ") || "—"
      )
    ))
  );
}

function MestrePanel() {
  const [personagens, setPersonagens] = useState([]);
  const [carregandoLista, setCarregandoLista] = useState(true);
  const [charSelecionado, setCharSelecionado] = useState(null);
  const [dadosPersonagem, setDadosPersonagem] = useState(null);
  const [carregandoFicha, setCarregandoFicha] = useState(false);
  const [prontoParaSalvar, setProntoParaSalvar] = useState(false);
  const [erro, setErro] = useState("");
  const [abaAtiva, setAbaAtiva] = useState("ficha");
  const [subAba, setSubAba] = useState("personagens");
  const [backups, setBackups] = useState([]);
  const [mostrandoBackups, setMostrandoBackups] = useState(false);
  const [criandoBackup, setCriandoBackup] = useState(false);
  const saveTimer = useRef(null);
  const ultimaEdicaoLocalRef = useRef(0);

  const atualizarLista = useCallback(async (mostrarLoading) => {
    if (mostrarLoading) setCarregandoLista(true);
    try {
      const r = await window.storage.get("ficha-index", true);
      const lista = r && r.value ? JSON.parse(r.value) : [];
      lista.sort((a, b) => (b.atualizadoEm || 0) - (a.atualizadoEm || 0));
      // Busca, pra cada personagem, quantos pedidos de venda estão pendentes — assim o mestre
      // vê o aviso direto na lista, sem precisar abrir a ficha de cada um.
      const comPendencias = await Promise.all(lista.map(async p => {
        try {
          const rf = await window.storage.get(`ficha:${p.charId}`, true);
          const d = rf && rf.value ? JSON.parse(rf.value) : null;
          const pendentes = d ? (d.pedidosVenda || []).filter(v => v.status === "pendente").length : 0;
          return {...p, pendentes};
        } catch (e) {
          return {...p, pendentes: 0};
        }
      }));
      setPersonagens(comPendencias);
    } catch (e) {
      setPersonagens([]);
    } finally {
      setCarregandoLista(false);
    }
  }, []);

  useEffect(() => {
    atualizarLista(true);
    const intervalId = setInterval(() => atualizarLista(false), 6000);
    return () => clearInterval(intervalId);
  }, [atualizarLista]);

  const selecionar = async charId => {
    setCharSelecionado(charId);
    setCarregandoFicha(true);
    setProntoParaSalvar(false);
    setErro("");
    setDadosPersonagem(null);
    setAbaAtiva("ficha");
    setMostrandoBackups(false);
    try {
      const r = await window.storage.get(`ficha:${charId}`, true);
      const carregados = r && r.value ? deepMerge(DEFAULT_DATA, JSON.parse(r.value)) : null;
      setDadosPersonagem(carregados);
      if (carregados) {
        // Garante um backup automático recente ANTES de qualquer edição do mestre —
        // é o ponto de restauração de segurança "antes de editar ou começar uma sessão".
        const listaAtual = await carregarBackupsFicha(charId);
        const ultimoAuto = listaAtual.filter(b => b.tipo === "automatico").sort((a, b) => b.criadoEm - a.criadoEm)[0];
        let listaFinal = listaAtual;
        if (!ultimoAuto || (Date.now() - ultimoAuto.criadoEm) >= BACKUP_FICHA_INTERVALO_AUTO_MS) {
          listaFinal = await criarBackupFicha(charId, carregados, "automatico");
        }
        setBackups(listaFinal);
      }
    } catch (e) {
      setErro("Não foi possível carregar esta ficha ainda.");
    } finally {
      setCarregandoFicha(false);
      setProntoParaSalvar(true);
    }
  };

  const criarBackupManual = async () => {
    if (!charSelecionado || !dadosPersonagem) return;
    setCriandoBackup(true);
    try {
      const nova = await criarBackupFicha(charSelecionado, dadosPersonagem, "manual");
      setBackups(nova);
    } catch (e) {
      setErro("Não foi possível criar o backup agora.");
    } finally {
      setCriandoBackup(false);
    }
  };

  const restaurarBackupFicha = async backup => {
    if (!window.confirm(`Restaurar o backup de ${formatarDataBackup(backup.criadoEm)}? Isso substitui os dados atuais desta ficha. Um backup do estado atual é criado automaticamente antes, por segurança.`)) return;
    try {
      const listaComSeguranca = await criarBackupFicha(charSelecionado, dadosPersonagem, "automatico");
      setBackups(listaComSeguranca);
      ultimaEdicaoLocalRef.current = Date.now();
      setDadosPersonagem(deepMerge(DEFAULT_DATA, structuredClone(backup.dados)));
    } catch (e) {
      setErro("Não foi possível restaurar esse backup.");
    }
  };

  const removerBackupFicha = async backupId => {
    if (!window.confirm("Apagar este backup? Não pode ser desfeito.")) return;
    const nova = backups.filter(b => b.id !== backupId);
    setBackups(nova);
    try { await salvarBackupsFicha(charSelecionado, nova); } catch (e) {}
  };

  const remover = async (charId, nome) => {
    if (!window.confirm(`Remover "${nome || "este personagem"}" da lista? Isso apaga a ficha dele salva na nuvem e não pode ser desfeito.`)) return;
    try { await window.storage.delete(`ficha:${charId}`, true); } catch (e) {}
    try {
      const r = await window.storage.get("ficha-index", true);
      let lista = r && r.value ? JSON.parse(r.value) : [];
      lista = lista.filter(x => x.charId !== charId);
      await window.storage.set("ficha-index", JSON.stringify(lista), true);
      setPersonagens(lista);
    } catch (e) {
      setPersonagens(prev => prev.filter(x => x.charId !== charId));
    }
  };

  // Apaga TODOS os personagens de uma vez — deixa a mesa em branco pra outros jogadores
  // criarem os deles do zero. Não mexe no catálogo de perícias, lojas, galeria ou mapa,
  // que são conteúdo de campanha do mestre, não fichas de jogador.
  const removerTodos = async () => {
    if (personagens.length === 0) return;
    if (!window.confirm(`Apagar TODOS os ${personagens.length} personagens da mesa? Isso apaga as fichas salvas na nuvem de todos eles e não pode ser desfeito.`)) return;
    try {
      await Promise.all(personagens.map(p => window.storage.delete(`ficha:${p.charId}`, true).catch(() => {})));
      await window.storage.set("ficha-index", JSON.stringify([]), true);
      setPersonagens([]);
      setCharSelecionado(null);
      setDadosPersonagem(null);
    } catch (e) {
      setErro("Não foi possível apagar todos os personagens agora. Tente de novo.");
    }
  };

  const setPathPersonagem = useCallback((path, val) => {
    ultimaEdicaoLocalRef.current = Date.now();
    setDadosPersonagem(prev => {
      if (!prev) return prev;
      const clone = structuredClone(prev);

function App() {

    (async () => {
      try {
        const r = await window.storage.get("meu-personagem-id");
        setMeuId(r.value);
      } catch (e) {
        const novoId = uid();
        try { await window.storage.set("meu-personagem-id", novoId); } catch (e2) {}
        setMeuId(novoId);
      }
    })();
  }, []);

  useEffect(() => {
    if (!meuId) return;
    (async () => {
      try {
        const r = await window.storage.get(`ficha:${meuId}`, true);

      } catch (e) {
      } finally {
        setCarregado(true);
      }
    })();
  }, [meuId]);

  useEffect(() => {
    if (!carregado || !meuId) return;
    setStatusSalvar("saving");

      try {
        await window.storage.set(`ficha:${meuId}`, JSON.stringify(dados), true);
        let lista = [];
        try {
          const r = await window.storage.get("ficha-index", true);
          lista = r && r.value ? JSON.parse(r.value) : [];
        } catch (e) { lista = []; }
        lista = lista.filter(x => x.charId !== meuId);
        lista.push({
          charId: meuId,
          nome: dados.personagem.nome || "Sem nome",
          nivel: dados.personagem.nivel,
          atualizadoEm: Date.now()

  useEffect(() => {
    if (!carregado || !meuId) return;
    const intervalId = setInterval(async () => {
      if (Date.now() - ultimaEdicaoLocalRef.current < 4000) return;
      const ativo = document.activeElement;
      if (ativo && (ativo.tagName === "INPUT" || ativo.tagName === "TEXTAREA")) return;
      try {

        if (!r || !r.value) return;
        const mesclado = deepMerge(DEFAULT_DATA, JSON.parse(r.value));

        React.createElement("button", {className: "modo-btn" + (modo === "mestre" ? " active" : ""), onClick: abrirMestre}, React.createElement(Users, {size: 13, strokeWidth: 1.75}), " Mestre", !mestreDesbloqueado ? " \uD83D\uDD12" : null)
      ),
      modo === "mestre"
        ? React.createElement(MestrePanel, null)
        : React.createElement(FichaTabs, {data: dados, setPath, highlighter, activeTab: abaAtiva, setActiveTab: setAbaAtiva, onReset: resetar, charId: meuId})
    ),
